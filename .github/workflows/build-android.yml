name: Build Android Release

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Android Bundle & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Next.js Export
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradlew Executable
        working-directory: frontend/android
        run: chmod +x ./gradlew

      - name: Build Release AAB & APK
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: voltApp2026!
          KEY_ALIAS: volt
          KEY_PASSWORD: voltApp2026!
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Upload Android App Bundle (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: volt-release-bundle-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload Android APK (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: volt-release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
