name: Build Android Release

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android Bundle & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Next.js Export
        working-directory: frontend
        env:
          NEXT_PUBLIC_FIREBASE_FUNCTION_URL: "https://us-central1-volt-94f9f.cloudfunctions.net"
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyC7Qyb6hVrX4t8iMadEl4WIC94hPQiuvwI"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "volt-94f9f.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "volt-94f9f"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "volt-94f9f.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "370469332401"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:370469332401:web:6ed1e408b07cf9cdcb8990"
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: "BEWnezsCJKyItO0cqpq-V-NN6Z50ssGz0pc39GklElmj878rU5ypcI3H5blkhFKGLxIVA8BRqHKy-XyF7VwTs7c"
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: "false"
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradlew Executable
        working-directory: frontend/android
        run: chmod +x ./gradlew

      - name: Build Release AAB & APK
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: voltApp2026!
          KEY_ALIAS: volt
          KEY_PASSWORD: voltApp2026!
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Upload Android App Bundle (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: volt-release-bundle-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload Android APK (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: volt-release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Volt Android Release v1.0.0
          draft: false
          prerelease: false
          files: |
            frontend/android/app/build/outputs/bundle/release/app-release.aab
            frontend/android/app/build/outputs/apk/release/app-release.apk
